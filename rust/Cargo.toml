[workspace]
members = ["crates/autorouter-core", "crates/autorouter-runtime", "crates/claude-autorouter", "xtask"]
exclude = ["vendor/hyper", "vendor/openssl", "fuzz"]
resolver = "3"

[workspace.package]
version = "0.5.2"
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"
repository = "https://github.com/frapposelli/claude-autorouter"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order", "raw_value", "float_roundtrip"] }
sha2 = { version = "0.10", features = ["asm"] }
getrandom = "0.3"
flate2 = "1.1"
subtle = "=2.6.1"
time = { version = "0.3", features = ["formatting"] }
async-compression = { version = "0.4", features = ["tokio", "gzip", "zlib", "deflate", "brotli"] }
num-bigint = "0.4"
ryu-js = "=1.0.3"
regex = "1.12"
url = "2.5"
icu_collator = "=2.3.1"
icu_locale_core = "=2.3.0"
tokio = { version = "=1.53.2", features = ["rt-multi-thread", "net", "io-util", "sync", "time", "macros", "process", "signal", "fs", "test-util"] }
tokio-util = { version = "0.7", features = ["rt"] }
hyper = { version = "=1.12.0", features = ["http1", "client", "server", "node-http1-compat"] }
hyper-util = { version = "0.1", features = ["tokio", "client-legacy", "http1"] }
hyper-rustls = { version = "0.27", default-features = false, features = ["http1", "tls12", "ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
openssl = { version = "=0.10.81", features = ["vendored"] }
http-body-util = "0.1"
bytes = "1.11"
nix = { version = "0.31", default-features = false, features = ["signal", "process", "term", "fs", "user"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[patch.crates-io]
hyper = { path = "vendor/hyper" }
openssl = { path = "vendor/openssl" }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
