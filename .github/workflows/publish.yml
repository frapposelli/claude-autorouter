name: Publish to npm

on:
  push:
    tags: ['v*']

permissions:
  contents: read

# Serialize releases so two versions cannot race to update the npm dist-tag.
concurrency:
  group: npm-publish
  queue: max
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  package:
    name: Prepare and test the release archive
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Validate the release tag and main-branch ancestry
        id: release
        run: node scripts/release-check.mjs source "$GITHUB_REF_NAME"
      - run: npm run release:pack
      - name: Install and test this exact archive
        env:
          ARCHIVE: ${{ steps.release.outputs.archive }}
        run: npm run test:package -- --archive "$ARCHIVE"
      - name: Verify archive contents and checksum after testing
        run: node scripts/release-check.mjs archive "$GITHUB_REF_NAME"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        id: upload
        with:
          name: npm-package-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            dist/*.tgz
            dist/*.tgz.sha256
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  publish:
    name: Publish the verified archive with npm OIDC
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org/
          package-manager-cache: false
      - name: Install the npm CLI with trusted-publishing support
        run: npm install --global npm@11.19.1 --ignore-scripts --no-audit --no-fund
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.package.outputs.artifact_id }}
          path: dist
          merge-multiple: true
      - name: Recheck the tag and downloaded archive
        id: release
        run: |
          node scripts/release-check.mjs source "$GITHUB_REF_NAME"
          node scripts/release-check.mjs archive "$GITHUB_REF_NAME"
      - name: Publish to the public npm registry
        env:
          ARCHIVE: ${{ steps.release.outputs.archive }}
          DIST_TAG: ${{ steps.release.outputs.dist_tag }}
          # npm provenance is unsupported for this private source repository.
          NPM_CONFIG_PROVENANCE: 'false'
        run: npm publish "$ARCHIVE" --access public --tag "$DIST_TAG" --registry=https://registry.npmjs.org/ --ignore-scripts --provenance=false
