name: Rust musl portability

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  musl:
    name: musl / ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            machine: x86_64
            target: x86_64-unknown-linux-musl
            gnu_target: x86_64-unknown-linux-gnu
            node_image: docker.io/library/node@sha256:01393fe5a51489b63da0ab51aa8e0a7ff9990132917cf20cfc3d46f5e36c0e48
            rust_sha256: 0ed5ec213fbde7cd720054d4a7eabd592822e73ce406da0aea57e7b1b48e8b0f
          - runner: ubuntu-24.04-arm
            machine: aarch64
            target: aarch64-unknown-linux-musl
            gnu_target: aarch64-unknown-linux-gnu
            node_image: docker.io/library/node@sha256:4a78eedb5c49d58c0c0b610ebc48f4ac397358604daac64e8dec1baecde2a31b
            rust_sha256: 7559507ec98f044718ab6a786e26ecfd09764b5af29e0f0c075eb8e738c3214d
    defaults:
      run:
        shell: bash
        working-directory: rust
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      OPENSSL_NO_VENDOR: '0'
      AUTOROUTER_BUILD_TARGET: ${{ matrix.target }}
      AUTOROUTER_BUILD_MACHINE: ${{ matrix.machine }}
      AUTOROUTER_SOURCE_ROOT: ${{ github.workspace }}
      AUTOROUTER_NODE_IMAGE: ${{ matrix.node_image }}
      AUTOROUTER_WORKFLOW_RUN: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.14.0'
          package-manager-cache: false
      - name: Freeze source identity and build-only SDK
        run: |
          set -euo pipefail
          test "$(uname -m)" = "$AUTOROUTER_BUILD_MACHINE"
          mkdir -p ../artifacts/rust-rewrite/musl-portability/home
          autorouter_epoch=$(git show -s --format=%ct HEAD)
          [[ "$autorouter_epoch" =~ ^[0-9]+$ ]]
          printf 'SOURCE_DATE_EPOCH=%s\nAUTOROUTER_SOURCE_COMMIT=%s\n' "$autorouter_epoch" "$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          autorouter_context=$(mktemp -d "$RUNNER_TEMP/autorouter-musl-context.XXXXXX")
          trap 'rm -rf "$autorouter_context"' EXIT
          cp distribution/ci/musl.Dockerfile "$autorouter_context/Dockerfile"
          cp distribution/musl-builder-pins.json distribution/ci/fetch-musl-apks.mjs "$autorouter_context/"
          docker build --pull --file "$autorouter_context/Dockerfile" --tag autorouter-musl-ci:local \
            --build-arg NODE_IMAGE='${{ matrix.node_image }}' \
            --build-arg APK_ARCH='${{ matrix.machine }}' \
            --build-arg RUST_ARCHIVE_SHA256='${{ matrix.rust_sha256 }}' "$autorouter_context"
          docker image inspect autorouter-musl-ci:local --format '{{.Id}}' > ../artifacts/rust-rewrite/musl-portability/build-image-id.txt
      - name: Fetch locked contributor dependencies without provider credentials
        id: musl_fetch
        run: |
          set -euo pipefail
          docker run --init --rm --user "$(id -u):$(id -g)" --volume "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" --workdir "$GITHUB_WORKSPACE/rust" \
            --env HOME="$GITHUB_WORKSPACE/artifacts/rust-rewrite/musl-portability/home" \
            --env CARGO_HOME="$GITHUB_WORKSPACE/artifacts/rust-rewrite/musl-portability/cargo-cache" --env AUTOROUTER_SOURCE_ROOT \
            autorouter-musl-ci:local /bin/bash distribution/ci/check-musl.sh fetch
      - name: Offline native musl build, static inspection, synthetic transport and installed lifecycle
        id: musl_check
        run: |
          set -euo pipefail
          docker run --init --rm --network none --user "$(id -u):$(id -g)" --volume "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" --workdir "$GITHUB_WORKSPACE/rust" \
            --env HOME="$GITHUB_WORKSPACE/artifacts/rust-rewrite/musl-portability/home" \
            --env CARGO_HOME="$GITHUB_WORKSPACE/artifacts/rust-rewrite/musl-portability/cargo-cache" \
            --env CARGO_TARGET_DIR="$GITHUB_WORKSPACE/artifacts/rust-rewrite/musl-portability/target-main" \
            --env CARGO_INCREMENTAL=0 --env CARGO_PROFILE_DEV_DEBUG=0 --env CARGO_PROFILE_TEST_DEBUG=0 \
            --env AUTOROUTER_BUILD_TARGET --env AUTOROUTER_BUILD_MACHINE --env AUTOROUTER_SOURCE_COMMIT --env AUTOROUTER_SOURCE_ROOT --env AUTOROUTER_NODE_IMAGE --env AUTOROUTER_WORKFLOW_RUN --env SOURCE_DATE_EPOCH \
            autorouter-musl-ci:local /bin/bash distribution/ci/check-musl.sh check
      - name: Verify settled musl phase prerequisites
        id: musl_phase_gate
        if: ${{ always() && !cancelled() && steps.musl_fetch.outcome == 'success' && (steps.musl_check.outcome == 'success' || steps.musl_check.outcome == 'failure') }}
        env:
          AUTOROUTER_MUSL_CHECK_OUTCOME: ${{ steps.musl_check.outcome }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {createHash} from 'node:crypto';
          import {appendFileSync,closeSync,constants,fstatSync,lstatSync,openSync,readSync} from 'node:fs';
          const out=process.env.AUTOROUTER_SOURCE_ROOT+'/artifacts/rust-rewrite/musl-portability';
          const read=(path,max)=>{
            const before=lstatSync(path,{bigint:true});assert.ok(before.isFile()&&!before.isSymbolicLink()&&before.nlink===1n&&before.size<=BigInt(max));
            const fd=openSync(path,constants.O_RDONLY|constants.O_NOFOLLOW|constants.O_NONBLOCK);
            try {const opened=fstatSync(fd,{bigint:true});assert.equal(opened.dev,before.dev);assert.equal(opened.ino,before.ino);const bytes=Buffer.alloc(Number(before.size));let at=0;while(at<bytes.length){const count=readSync(fd,bytes,at,bytes.length-at,at);assert.ok(count>0);at+=count;}assert.equal(readSync(fd,Buffer.alloc(1),0,1,at),0);const after=fstatSync(fd,{bigint:true}),leaf=lstatSync(path,{bigint:true});for(const info of[opened,after,leaf])for(const key of['dev','ino','size','mode','uid','gid','nlink','mtimeNs','ctimeNs'])assert.equal(info[key],before[key]);return bytes;}finally{closeSync(fd);}
          };
          const keys=(value,names)=>assert.deepEqual(Object.keys(value).sort(),[...names].sort());
          const summary=JSON.parse(read(out+'/phase-summary.json',1024));keys(summary,['schema_version','kind','phase_count','exit_code']);assert.equal(summary.schema_version,1);assert.equal(summary.kind,'musl_ci_phase_summary');assert.equal(summary.phase_count,20);assert.ok(Number.isInteger(summary.exit_code)&&summary.exit_code>=0&&summary.exit_code<=255);assert.equal(process.env.AUTOROUTER_MUSL_CHECK_OUTCOME,summary.exit_code===0?'success':'failure');
          const names=['workspace','production','helper','inspection','freeze-reference','parity',...['check-config-commands','check-node-options-startup','check-gateway','check-gateway-resources','check-http-parser','check-upstream-transport','check-upstream-security','check-tls-options','check-localhost-transport'].map(x=>'protocol-'+x),'protocol-unicode','npm','direct','rollback','repro'];
          const lines=read(out+'/phase-statuses.jsonl',65536).toString('utf8').split('\n');assert.equal(lines.pop(),'');assert.equal(lines.length,names.length);
          const rows=lines.map((line,index)=>{const value=JSON.parse(line);assert.equal(value.phase,names[index]);if(Object.hasOwn(value,'skipped_for')){keys(value,['phase','skipped_for']);assert.ok(names.slice(0,index).includes(value.skipped_for));}else{keys(value,['phase','command_exit_code','log_exit_code']);for(const key of['command_exit_code','log_exit_code'])assert.ok(Number.isInteger(value[key])&&value[key]>=0&&value[key]<=255);}return value;});
          const passed=name=>{const row=rows[names.indexOf(name)];return row.command_exit_code===0&&row.log_exit_code===0;};
          assert.equal(summary.exit_code===0,names.every(passed));
          const dependency=name=>name==='helper'?'production':name==='inspection'?'helper':name==='freeze-reference'||name==='npm'||name==='repro'?'inspection':name==='parity'||name.startsWith('protocol-')?'freeze-reference':name==='direct'||name==='rollback'?'npm':null;
          for(const[name,index]of names.map((name,index)=>[name,index])){const required=dependency(name),row=rows[index];if(required!==null&&!passed(required))assert.equal(row.skipped_for,required);else assert.equal(Object.hasOwn(row,'skipped_for'),false);}
          const binaryReady=['production','helper','inspection'].every(passed);
          if(binaryReady)for(const[file,sidecar]of[['autorouter-audit-bootstrap','bootstrap-binary.sha256'],['claude-autorouter-musl','production-binary.sha256'],['xtask-musl','helper-binary.sha256']]){const path=out+'/'+file,bytes=read(path,33554432);assert.equal(read(out+'/'+sidecar,4096).toString('utf8'),createHash('sha256').update(bytes).digest('hex')+'  '+path+'\n');}
          const archivesReady=binaryReady&&['npm','direct'].every(passed);
          const referenceReady=binaryReady&&passed('freeze-reference');
          appendFileSync(process.env.GITHUB_OUTPUT,'binary_ready='+binaryReady+'\narchives_ready='+archivesReady+'\nreference_ready='+referenceReady+'\n');
          NODE
      - name: Build and audit genuine GNU control separately
        id: gnu_control
        if: ${{ always() && !cancelled() && steps.musl_phase_gate.outcome == 'success' && steps.musl_phase_gate.outputs.binary_ready == 'true' }}
        run: |
          set -euo pipefail
          cargo fetch --locked
          export CARGO_TARGET_DIR="$GITHUB_WORKSPACE/artifacts/rust-rewrite/musl-portability/gnu-target"
          case "$AUTOROUTER_BUILD_MACHINE" in x86_64) export RUSTFLAGS='-C target-cpu=x86-64' ;; aarch64) export RUSTFLAGS='-C target-cpu=generic' ;; *) exit 1 ;; esac
          cargo build --release --locked --package claude-autorouter --message-format=json > ../artifacts/rust-rewrite/musl-portability/gnu-control-build.jsonl
          cp "$CARGO_TARGET_DIR/release/claude-autorouter" ../artifacts/rust-rewrite/musl-portability/claude-autorouter-gnu
          ../artifacts/rust-rewrite/musl-portability/autorouter-audit-bootstrap production-features --build-report ../artifacts/rust-rewrite/musl-portability/gnu-control-build.jsonl > ../artifacts/rust-rewrite/musl-portability/gnu-control-features.json
          unset RUSTFLAGS
          cargo test --offline --locked --package claude-autorouter --no-run
      - name: Exact musl artifacts on GNU host and independently observed mixed npm selection
        if: ${{ always() && !cancelled() && steps.musl_phase_gate.outcome == 'success' && steps.musl_phase_gate.outputs.archives_ready == 'true' && steps.musl_phase_gate.outputs.reference_ready == 'true' && steps.gnu_control.outcome == 'success' }}
        run: |
          set -euo pipefail
          out="$GITHUB_WORKSPACE/artifacts/rust-rewrite/musl-portability"
          export CARGO_TARGET_DIR="$out/gnu-target"
          mkdir "$out/alpine-reports"
          for report in ../artifacts/rust-rewrite/parity*.json ../artifacts/rust-rewrite/tls-*.json; do
            [[ ! -f "$report" ]] || cp "$report" "$out/alpine-reports/"
          done
          version=$("$out/claude-autorouter-musl" --version)
          "$out/xtask-musl" package-smoke "artifacts/rust-rewrite/musl-package/claude-autorouter-$version.tgz" > "$out/gnu-musl-npm-smoke.json"
          "$out/xtask-musl" release-pack smoke-direct "../artifacts/rust-rewrite/musl-direct/claude-autorouter-$version-${{ matrix.target }}.tar.gz" > "$out/gnu-musl-direct-smoke.json"
          "$out/xtask-musl" package --binary "${{ matrix.target }}=$out/claude-autorouter-musl" \
            --binary "${{ matrix.gnu_target }}=$out/claude-autorouter-gnu" --output artifacts/rust-rewrite/musl-mixed-package --smoke > "$out/gnu-mixed-npm-smoke.json"
          autorouter_sha=$(sha256sum "$out/claude-autorouter-musl" | cut -d' ' -f1)
          node parity/check-musl-dispatcher.mjs "../artifacts/rust-rewrite/musl-mixed-package/claude-autorouter-$version.tgz" \
            "$autorouter_sha" '${{ matrix.target }}' "$out/gnu-mixed-dispatch.json"
          # Keep all Alpine evidence before same-byte transport/TLS/localhost
          # reruns; known TLS characterizations remain unsuccessful and separate.
          # Earlier independent Alpine protocol failure may leave no report.
          # Remove only an existing regular report, after preserving it above.
          if [[ -e ../artifacts/rust-rewrite/parity-localhost-transport.json || -L ../artifacts/rust-rewrite/parity-localhost-transport.json ]]; then
            [[ -f ../artifacts/rust-rewrite/parity-localhost-transport.json && ! -L ../artifacts/rust-rewrite/parity-localhost-transport.json ]]
            rm ../artifacts/rust-rewrite/parity-localhost-transport.json
          fi
          for check in check-upstream-transport check-upstream-security check-tls-options check-localhost-transport; do
            node "parity/$check.mjs" ../artifacts/rust-rewrite/reference "$out/claude-autorouter-musl"
          done
          mkdir "$out/gnu-reports"
          for report in parity-upstream-transport.json parity-upstream-security.json parity-tls-options.json tls-policy-characterization.json parity-localhost-transport.json; do
            cp "../artifacts/rust-rewrite/$report" "$out/gnu-reports/"
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: rust-musl-${{ matrix.target }}
          path: |
            artifacts/rust-rewrite/musl-portability/*.json
            artifacts/rust-rewrite/musl-portability/*.jsonl
            artifacts/rust-rewrite/musl-portability/phase-*.log
            artifacts/rust-rewrite/musl-portability/*.txt
            artifacts/rust-rewrite/musl-portability/alpine-reports/*.json
            artifacts/rust-rewrite/musl-portability/gnu-reports/*.json
            artifacts/rust-rewrite/musl-portability/claude-autorouter-*
            artifacts/rust-rewrite/musl-portability/autorouter-audit-bootstrap
            artifacts/rust-rewrite/musl-portability/xtask-musl
            artifacts/rust-rewrite/musl-portability/bootstrap-binary.sha256
            artifacts/rust-rewrite/musl-portability/production-binary.sha256
            artifacts/rust-rewrite/musl-portability/helper-binary.sha256
            artifacts/rust-rewrite/musl-package/*
            artifacts/rust-rewrite/musl-direct/*
            artifacts/rust-rewrite/upgrade-rollback-musl/report.json
            artifacts/rust-rewrite/upgrade-rollback-musl/candidate.tgz
            artifacts/rust-rewrite/upgrade-rollback-musl/baseline/*.tgz
            artifacts/rust-rewrite/upgrade-rollback-musl/baseline/*.sha256
            artifacts/rust-rewrite/musl-mixed-package/*
            artifacts/rust-rewrite/musl-parity/*.json
            artifacts/rust-rewrite/parity*.json
            artifacts/rust-rewrite/tls-*.json
          if-no-files-found: warn
