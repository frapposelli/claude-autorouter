name: Feature request
description: Propose a focused improvement to AutoRouter.
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: Describe the task or limitation, using examples without private content.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Explain the expected result and how you would know it works. Identify effects on authentication, permissions, privacy or model compatibility when relevant.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives and scope
      description: Describe existing workarounds, related issues and any constraints. No implementation is required to propose an improvement.
